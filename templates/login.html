{% extends "base.html" %}
{% block title %}Login · MuseumDB{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-header bg-white fw-semibold">Select access role</div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Role</label>
            <select name="role" class="form-select">
              <option value="viewer">Viewer: search and visualise only</option>
              <option value="admin">Admin: create, update and delete</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input name="username" class="form-control" placeholder="viewer or admin">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control" placeholder="Admin default: admin123">
            <div class="form-text">Viewer login does not require a password. Admin default is admin / admin123 unless environment variables are changed.</div>
          </div>
          <button class="btn btn-primary w-100">Continue</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
